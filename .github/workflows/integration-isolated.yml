# Isolated Integration Tests — Self-Contained Supabase Environment
# Runs a disposable local Supabase stack with fixtures and credentials.
# This workflow does NOT touch production.
#
# To run locally (requires Docker):
#   supabase start
#   node tests/test_rls.js --ci
#
# Prerequisites for CI:
#   - Docker available in runner
#   - Supabase CLI installed
#   - No secrets from production project needed
name: Integration Tests (Isolated)

on:
  workflow_dispatch:      # Manual trigger
  push:
    branches: ['feature/**', 'security/**']
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'main.js'
      - 'lib/**'
      - 'systems/**'

jobs:
  isolated-integration:
    name: Isolated Supabase Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # These are ephemeral local-only keys, NOT secrets
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WO_o0BopYoAhfVB78Yc2BMF-4kICDXXk-2nQ
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply test fixtures
        run: |
          # Wait for DB to be healthy
          for i in $(seq 1 12); do
            if docker exec supabase_db_omnis pg_isready -U postgres > /dev/null 2>&1; then
              echo "DB ready"
              break
            fi
            sleep 5
          done

          # Apply SQL fixtures (creates test config + schema additions)
          docker exec -i supabase_db_omnis psql -U postgres < tests/fixtures.sql

      - name: Start Edge Functions
        run: |
          supabase functions serve --no-verify-jwt &
          sleep 10
          echo "Edge Functions started"

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run Email Tests
        run: node tests/test_email.js

      - name: Run Company Isolation Tests
        run: node tests/test_company_isolation.js

      - name: Run Compensation Tests
        run: node tests/test_compensation.js

      - name: Run AI Proxy Tests
        run: node tests/test_ai_proxy.js

      - name: Run RLS Tests
        run: node tests/test_rls.js --ci

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
