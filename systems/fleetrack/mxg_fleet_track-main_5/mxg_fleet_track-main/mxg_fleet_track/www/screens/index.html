    <div class="container mx-auto min-h-screen">

              Service Tracking Summary
              <br />
              <span class="font-black">(STS)</span>
            </a>
          </div>

          <div
            onclick="location.href='/screens/daily_breakdown_report'"
            class="border-2 border-red-600 cursor-pointer hover:bg-red-600 hover:text-white shadow-md text-red-600 font-medium text-center p-3 hover:shadow-2xl rounded">

              Daily Breakdown Report
              <br />
              <span class="font-black">(DBR)</span>
            </a>
          </div>

          <div
            onclick="location.href='/screens/major_defects_report'"

            <a href="/screens/major_defects_report" class="text-center">

              <br />
              <span class="font-black">(MDR)</span>
            </a>

            onclick="location.href='/screens/wip'"

              Work in Progress
              <br />
              <span class="font-black">(WIP)</span>
            </a>
          </div>
          <div
            onclick="location.href='/screens/service_exchange_report'"

              <span class="font-black">(SEC)</span>
